[package]
name = "ursine-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ursine-api.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
getrandom.workspace = true
# Real PAM on FeralOS builds; dev builds use the stub authenticator.
# pam-client 0.2 = maintained fork of pam 0.7: pam-sys 0.5 (pregenerated
# bindings, no bindgen), no vulnerable `users` dependency.
# Public API is the pam_client:: Context style.
pam-client = { version = "0.2", optional = true, default-features = false }

[features]
default = []
pam = ["dep:pam-client"]
