[workspace]
resolver = "2"
members = ["src/ursine-api", "src/ursine-core", "src/ursined", "src/ursine"]

[workspace.package]
version = "0.23.0"
edition = "2021"
license = "ISC"
authors = ["skea999 <sket999@disroot.org>"]
repository = "https://github.com/skea999/ursine"
description = "Ursine control center: root daemon, shared protocol and libcosmic GUI"
readme = "README.md"
keywords = ["linux", "system-administration", "nix", "cosmic", "daemon"]
categories = ["system-tools", "command-line-utilities"]

[workspace.dependencies]
ursine-api = { path = "src/ursine-api", version = "0.23.0" }
ursine-core = { path = "src/ursine-core", version = "0.23.0" }
# Same pin as the GUI: cosmic-theme writes the COSMIC config entries that all
# libcosmic apps read (uniform theming target).
cosmic-theme = { version = "1.0.0", git = "https://github.com/pop-os/libcosmic", rev = "430f3d48a97d8779f9c1985473912e594ccca1ae" }
cosmic-config = { version = "1.0.0", git = "https://github.com/pop-os/libcosmic", rev = "430f3d48a97d8779f9c1985473912e594ccca1ae" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
  "signal",
  "process",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
pwhash = "1"
kdl = "6"
regex = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unused_qualifications = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
missing_debug_implementations = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
indexing_slicing = "deny"
string_slice = "deny"
# Style-only or intentional; documented in docs/STATIC-ANALYSIS.md.
too_many_lines = "allow"
large_futures = "allow"
multiple_crate_versions = "allow"
struct_excessive_bools = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"
must_use_candidate = "allow"
suspicious_operation_groupings = "allow"
significant_drop_tightening = "allow"
format_push_string = "allow"
assert_is_empty = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
