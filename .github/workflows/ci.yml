# Ursine CI — two jobs, linear by design.
#
#   verify  ONE job, ONE image (ci/Containerfile → ursine-ci): build, code
#           tests, functional tests, static analysis, docs, release binary.
#           Push/PR: everything runs, the binary is verified and DISCARDED.
#           Tag: tests are skipped (already run on the push that created the
#           commit); only the release binary is built and published.
#   nix     nixos/nix container, no build and no tests: PR/main Nix lint +
#           flake evaluation; tag receives the published tarball, runs a fast
#           integrity smoke, pins nix/binary.nix and attaches the flake source.
#
# Host isolation: no toolchain on the runner; every command runs in a
# container. Cargo caches are restore-only from untrusted refs; only main may
# save. Static analysis policy: docs/STATIC-ANALYSIS.md. Canonical commands:
# docs/guides/build-and-test.md.
#
# Why binaries are built in Alpine, not Nix: nixpkgs does not cache musl
# toolchains — a source build takes hours. Alpine IS musl and builds in ~1 min.
# The flake packages the pinned release artifact (nix/binary.nix, reproducible
# URL+sha256). Since the shadow-auth switch the daemon and CLI build FULLY
# STATIC (no C dependencies); the GUI stays dynamic (Alpine ships no
# libxkbcommon.a — every desktop provides it).

name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  NIX_CONFIG: "experimental-features = nix-command flakes"
  CI_IMAGE: ursine-ci:ci
  NIX_IMAGE: nixos/nix@sha256:62c506c32c75395163676006f0c00d75c31578fffaac1167d600289f72477b78

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag: create the release and upload the assets
      security-events: write # upload the zizmor SARIF on main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve version and validate the tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3

      - name: Build the CI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          file: ci/Containerfile
          tags: ursine-ci:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            artifacts/cargo-home/registry/index
            artifacts/cargo-home/registry/cache
            artifacts/cargo-home/git/db
            artifacts/target
          key: cargo-verify-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'ci/Containerfile') }}
          restore-keys: |
            cargo-verify-

      - name: Open the artifact run directory
        run: |
          run=$(sh scripts/run-dir.sh)
          test -n "$run"
          echo "RUN_DIR=$run" >> "$GITHUB_ENV"

      - name: Verify — build, tests, static, docs, release binary (push/PR)
        if: github.ref_type != 'tag'
        run: |
          docker run --rm --network=host -v "$PWD:/work" -w /work \
            -e CARGO_HOME=/work/artifacts/cargo-home \
            -e RUST_MIN_STACK=16777216 \
            -e "URSINE_RUN_DIR=/work/$RUN_DIR" \
            -e "ZIZMOR_SARIF=/work/$RUN_DIR/zizmor.sarif" \
            ursine-ci:ci sh scripts/verify.sh

      - name: Upload the zizmor SARIF (main only)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles(format('{0}/zizmor.sarif', env.RUN_DIR)) != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: ${{ env.RUN_DIR }}/zizmor.sarif
          category: zizmor

      - name: Build the release package (tag)
        if: github.ref_type == 'tag'
        run: |
          docker run --rm --network=host -v "$PWD:/work" -w /work \
            -e CARGO_HOME=/work/artifacts/cargo-home \
            -e "URSINE_RUN_DIR=/work/$RUN_DIR" \
            ursine-ci:ci sh scripts/package-release.sh --release \
            "ursine-${GITHUB_REF_NAME}-x86_64-musl.tar.gz"

      - name: Publish the tag release
        if: github.ref_type == 'tag'
        working-directory: ${{ env.RUN_DIR }}/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          sha256sum -c ./*.sha256
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft=false \
              --title "$GITHUB_REF_NAME" --generate-notes
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for artifact in ./*.tar.gz ./*.sha256; do
            name=$(basename "$artifact")
            if printf '%s\n' "$assets" | grep -Fxq "$name"; then
              echo "already published: $name"
            else
              gh release upload "$GITHUB_REF_NAME" "$artifact"
            fi
          done
          # A draft is invisible to anonymous download; the flake needs the
          # public URL, so the state is forced here and proven by the nix job.
          gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Save Cargo cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            artifacts/cargo-home/registry/index
            artifacts/cargo-home/registry/cache
            artifacts/cargo-home/git/db
            artifacts/target
          key: cargo-verify-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'ci/Containerfile') }}

  nix:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ASSET: ursine-${{ github.ref_name }}-x86_64-musl.tar.gz
    steps:
      # A tag updates the pin on main; PRs and branches check out their ref.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_type == 'tag' && 'main' || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Nix lint and flake evaluation (PR/main, no build)
        if: github.ref_type != 'tag'
        run: |
          # The bind-mounted checkout belongs to the runner user while the
          # container runs as root: libgit2 refuses a repository it does not
          # own, so mark the mount safe inside the container.
          docker run --rm --network=host -v "$PWD:/work" -w /work \
            -e NIX_CONFIG="$NIX_CONFIG" "$NIX_IMAGE" sh -c '
              git config --global --add safe.directory /work
              nix run nixpkgs#statix -- check flake.nix
              nix run nixpkgs#statix -- check nix
              nix run nixpkgs#deadnix -- --fail flake.nix nix
              nix run nixpkgs#alejandra -- --check flake.nix nix
              nix eval --raw .#packages.x86_64-linux.ursine.version
            '

      - name: Fast integrity smoke of the published tarball (tag)
        if: github.ref_type == 'tag'
        run: |
          set -eu
          # Anonymous download on purpose: a draft release answers 404, and the
          # flake would pin an asset nobody can fetch.
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          mkdir -p artifacts/release artifacts/smoke
          curl -fsSL -o "artifacts/release/$RELEASE_ASSET" "$base/$RELEASE_ASSET"
          curl -fsSL -o "artifacts/release/$RELEASE_ASSET.sha256" "$base/$RELEASE_ASSET.sha256"
          cd artifacts/release
          sha256sum -c "./$RELEASE_ASSET.sha256"
          gzip -t "$RELEASE_ASSET"
          tar tzf "$RELEASE_ASSET" >/dev/null
          for entry in bin/ursined bin/ursinectl bin/ursine install.sh bin/ursine-activate \
            packaging/org.feralos.Ursine.desktop packaging/icons/org.feralos.Ursine.svg; do
            tar tzf "$RELEASE_ASSET" | grep -Fqx "./$entry"
          done
          cd "$GITHUB_WORKSPACE"
          tar xzf "artifacts/release/$RELEASE_ASSET" -C artifacts/smoke
          if readelf -d artifacts/smoke/bin/ursined | grep -q NEEDED; then
            echo "ursined is not static" >&2
            exit 1
          fi
          if readelf -d artifacts/smoke/bin/ursinectl | grep -q NEEDED; then
            echo "ursinectl is not static" >&2
            exit 1
          fi
          artifacts/smoke/bin/ursined --version | grep -Fq 'auth: shadow'
          echo "smoke: tarball is intact and the daemon runs"

      - name: Pin the release and package the flake source (tag)
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha=$(cut -d' ' -f1 artifacts/release/*.sha256 | head -n 1)
          test -n "$sha"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${RELEASE_ASSET}"
          sed -i \
            -e "s|^  version = \".*\";|  version = \"${version}\";|" \
            -e "s|^  url = \".*\";|  url = \"${url}\";|" \
            -e "s|^  sha256 = \".*\";|  sha256 = \"${sha}\";|" \
            nix/binary.nix
          git diff -- nix/binary.nix
          if git diff --quiet -- nix/binary.nix; then
            echo "release pin already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add nix/binary.nix
            git commit -m "chore(nix): pin release ${GITHUB_REF_NAME} [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
          docker run --rm --network=host -v "$PWD:/work" -w /work \
            -e NIX_CONFIG="$NIX_CONFIG" "$NIX_IMAGE" sh -c '
              git config --global --add safe.directory /work
              test "$(nix eval --raw .#packages.x86_64-linux.ursine.version)" = "'"${version}"'"
            '
          flake="ursine-flake-${GITHUB_REF_NAME}.tar.gz"
          tar czf "artifacts/release/$flake" \
            flake.nix flake.lock nix src/tools/ursine-activate.sh \
            src/tools/ursine-deactivate.sh README.md
          (
            cd artifacts/release
            sha256sum "$flake" >"$flake.sha256"
          )

      - name: Attach the flake to the tag release (tag)
        if: github.ref_type == 'tag'
        working-directory: artifacts/release
        run: |
          set -eu
          flake="ursine-flake-${GITHUB_REF_NAME}.tar.gz"
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for artifact in "$flake" "$flake.sha256"; do
            if printf '%s\n' "$assets" | grep -Fxq "$artifact"; then
              echo "already published: $artifact"
            else
              gh release upload "$GITHUB_REF_NAME" "$artifact"
            fi
          done
