# Ursine CI — fully containerized (rule 9): no host toolchains on runners.
#
# Jobs: test matrix (default/pam) · lint (clippy+fmt) · vet (cargo-vet) ·
#       audit (RustSec) · sast (Semgrep) · flake (nix package check/build) ·
#       package (release binaries in Alpine) · publish (tag / rolling latest).
#
# Why binaries are built in Alpine, not Nix: nixpkgs does not cache musl
# toolchains (stable included) — a source build takes hours. Alpine IS musl and
# builds in ~1 min. The flake packages the pinned release artifact
# (nix/binary.nix, reproducible URL+sha256). PAM modules are dlopen'ed at
# runtime, so binaries must be DYNAMIC musl (static musl has no dlopen).
#
# Layout/spec reference: docs/specs/SPEC-packaging-infra.md

name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  NIX_CONFIG: "experimental-features = nix-command flakes"

jobs:
  # ── Test matrix: one cargo test run per feature combination, musl ──
  test:
    runs-on: ubuntu-latest
    container:
      image: rust:1-alpine
    strategy:
      fail-fast: false
      matrix:
        features: ["", "pam"]
    name: test (${{ matrix.features || 'default' }})
    steps:
      - run: apk add --no-cache git nodejs linux-pam-dev
      - uses: actions/checkout@v4
      - name: Test
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo test --workspace --exclude ursine --no-default-features
          else
            cargo test --workspace --exclude ursine --features ${{ matrix.features }}
          fi

  # ── Lint + format gate (all features) ──
  lint:
    runs-on: ubuntu-latest
    container:
      image: rust:1-alpine
    steps:
      - run: apk add --no-cache git nodejs linux-pam-dev
      - run: rustup component add clippy rustfmt
      - uses: actions/checkout@v4
      - run: cargo clippy --workspace --exclude ursine --all-features -- -D warnings
      - run: cargo fmt --check

  # ── GUI: libcosmic build on musl (heavy; own job) ──
  gui:
    runs-on: ubuntu-latest
    container:
      image: rust:1-alpine
    steps:
      - run: |
          apk add --no-cache git nodejs cmake fontconfig-dev freetype-dev \
            libxkbcommon-dev expat-dev pkgconf
      - run: rustup component add clippy
      - uses: actions/checkout@v4
      - run: cargo build -p ursine
      - run: cargo clippy -p ursine -- -D warnings

  # ── Supply-chain vetting (cargo-vet) ──
  vet:
    runs-on: ubuntu-latest
    container:
      image: rust:1-alpine
    steps:
      - run: apk add --no-cache git nodejs
      - uses: actions/checkout@v4
      # musl container: taiki-e prebuilds are glibc; build from source instead.
      - run: cargo install cargo-vet --locked
      - run: cargo vet --locked

  # ── Dependency vulnerabilities (RustSec) ──
  audit:
    runs-on: ubuntu-latest
    container:
      image: rust:1-alpine
    steps:
      - run: apk add --no-cache git nodejs
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # ── SAST (Semgrep, Rust ruleset) ──
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      # semgrep image ships git; no JS actions needed here.
      - run: |
          git clone --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" repo
          cd repo
          git fetch --depth 1 origin "$GITHUB_SHA" && git checkout "$GITHUB_SHA"
      - working-directory: repo
        run: semgrep scan --config p/rust --error --quiet

  # ── Nix flake: package the pinned musl artifact (fast, reproducible) ──
  flake:
    runs-on: ubuntu-latest
    container:
      image: nixos/nix
    steps:
      # No JS actions in this image (runner node cannot exec here).
      - run: |
          git init repo && cd repo
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD
          git config --global --add safe.directory "$GITHUB_WORKSPACE/repo"
      - working-directory: repo
        run: nix flake check
      - working-directory: repo
        run: nix build --out-link artifacts/result

  # ── Package: musl release binaries (Alpine), publish tag or rolling latest ──
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: rust:1-alpine
    needs: [test, lint, vet, audit, sast, flake]
    steps:
      - run: |
          apk add --no-cache git nodejs linux-pam-dev tar \
            cmake fontconfig-dev freetype-dev libxkbcommon-dev expat-dev pkgconf
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # gh invokes git; container ownership differs from the checkout dir owner.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build release binaries
        run: |
          cargo build --release -p ursined --features pam
          cargo build --release -p ursine
          mkdir -p artifacts/pkg/bin
          cp artifacts/target/release/ursined artifacts/target/release/ursine artifacts/pkg/bin/
          cp install.sh artifacts/pkg/
          cp -r packaging artifacts/pkg/
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="ursine-${GITHUB_REF_NAME}-x86_64-musl.tar.gz"
          else
            NAME="ursine-latest-x86_64-musl.tar.gz"
          fi
          tar czf "$NAME" -C artifacts/pkg .
          sha256sum "$NAME" > "$NAME.sha256"
          echo "ASSET=$NAME" >> "$GITHUB_ENV"
          echo "CHECKSUM=$NAME.sha256" >> "$GITHUB_ENV"
          tar tzf "$NAME"
          cat "$NAME.sha256"
      - name: Smoke-test release installer
        run: |
          sh -n install.sh
          sh -n packaging/openrc/ursined
          sh -n packaging/dinit/ursined.wrapper
          mkdir -p artifacts/smoke
          tar xzf "$ASSET" -C artifacts/smoke
          for init in systemd openrc dinit; do
            root="$PWD/artifacts/smoke/root-$init"
            case "$init" in
            systemd)
              artifacts/smoke/install.sh --destdir "$root" --prefix /usr --init systemd --no-start
              test -f "$root/etc/systemd/system/ursined.service"
              ;;
            openrc)
              artifacts/smoke/install.sh --destdir "$root" --prefix /usr --init openrc --no-start
              test -x "$root/etc/init.d/ursined"
              ;;
            dinit)
              artifacts/smoke/install.sh --destdir "$root" --prefix /usr --init dinit \
                --unitdir /lib/dinit.d --libexecdir /usr/lib --no-start
              test -f "$root/lib/dinit.d/ursined"
              test -x "$root/usr/lib/dinit/ursined"
              test -f "$root/etc/dinit.d/config/ursined.conf"
              ;;
            esac
            test -f "$root/etc/pam.d/ursine"
            test "$(stat -c '%a' "$root/etc/pam.d/ursine")" = "644"
            test -x "$root/usr/bin/ursine"
            test -x "$root/usr/sbin/ursined"
            test "$("$root/usr/sbin/ursined" --version | grep -c 'auth: pam')" = "1"
          done
      - name: Stage release assets
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          mkdir -p artifacts/release
          cp "$ASSET" "$CHECKSUM" artifacts/release/
      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: ursine-release
          path: artifacts/release
          if-no-files-found: error
          retention-days: 7

  # ── Publish: write token isolated from build code ──────────────────────────
  publish:
    runs-on: ubuntu-latest
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
      actions: read
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ursine-release
          path: artifacts/release
      - name: Resolve asset names
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="ursine-${GITHUB_REF_NAME}-x86_64-musl.tar.gz"
          else
            NAME="ursine-latest-x86_64-musl.tar.gz"
          fi
          echo "ASSET=$NAME" >> "$GITHUB_ENV"
          echo "CHECKSUM=$NAME.sha256" >> "$GITHUB_ENV"
      - name: Publish versioned tag release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: artifacts/release
        run: |
          sha256sum -c "$CHECKSUM"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for artifact in "$ASSET" "$CHECKSUM"; do
            if printf '%s\n' "$assets" | grep -Fxq "$artifact"; then
              echo "already published: $artifact"
            else
              gh release upload "$GITHUB_REF_NAME" "$artifact"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish rolling `latest` (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: artifacts/release
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "$ASSET" "$CHECKSUM" \
            --title "Development snapshot (latest)" \
            --notes "Automated musl build from $GITHUB_SHA on $(date -u +%Y-%m-%dT%H:%MZ)" \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
