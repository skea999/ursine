# Ursine CI — fully containerized (rule 9): no host toolchains on runners.
#
# Jobs: test matrix (default/pam) · lint (clippy+fmt) · vet (cargo-vet) ·
#       audit (RustSec) · sast (Semgrep) · version (release gate) ·
#       changes (PR build filter) · flake (nix package check/build) ·
#       package (release binaries in Alpine) · publish (tag / rolling latest) ·
#       verify-pin (post-tag flake check on main).
#
# Why binaries are built in Alpine, not Nix: nixpkgs does not cache musl
# toolchains (stable included) — a source build takes hours. Alpine IS musl and
# builds in ~1 min. The flake packages the pinned release artifact
# (nix/binary.nix, reproducible URL+sha256). PAM modules are dlopen'ed at
# runtime, so binaries must be DYNAMIC musl (static musl has no dlopen).
#
# Layout/spec reference: docs/specs/SPEC-packaging-infra.md

name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      force_package:
        description: Build the release package even when the version is already tagged
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  NIX_CONFIG: "experimental-features = nix-command flakes"

jobs:
  # ── Test matrix: one cargo test run per feature combination, musl ──
  test:
    runs-on: ubuntu-latest
    container:
      image: rust:1-alpine
    strategy:
      fail-fast: false
      matrix:
        features: ["", "pam"]
    name: test (${{ matrix.features || 'default' }})
    steps:
      - run: apk add --no-cache git nodejs linux-pam-dev
      - uses: actions/checkout@v4
      - name: Test
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo test --workspace --exclude ursine --no-default-features
          else
            cargo test --workspace --exclude ursine --features ${{ matrix.features }}
          fi

  # ── Lint + format gate (all features) ──
  lint:
    runs-on: ubuntu-latest
    container:
      image: rust:1-alpine
    steps:
      - run: apk add --no-cache git nodejs linux-pam-dev
      - run: rustup component add clippy rustfmt
      - uses: actions/checkout@v4
      - run: cargo clippy --workspace --exclude ursine --all-features -- -D warnings
      - run: cargo fmt --check

  # ── GUI: libcosmic build on musl (heavy; own job) ──
  gui:
    runs-on: ubuntu-latest
    container:
      image: rust:1-alpine
    steps:
      - run: |
          apk add --no-cache git nodejs cmake fontconfig-dev freetype-dev \
            libxkbcommon-dev expat-dev pkgconf
      - run: rustup component add clippy
      - uses: actions/checkout@v4
      - run: cargo build -p ursine
      - run: cargo clippy -p ursine -- -D warnings

  # ── Supply-chain vetting (cargo-vet) ──
  vet:
    runs-on: ubuntu-latest
    container:
      image: rust:1-alpine
    steps:
      - run: apk add --no-cache git nodejs
      - uses: actions/checkout@v4
      # musl container: taiki-e prebuilds are glibc; build from source instead.
      - run: cargo install cargo-vet --locked
      - run: cargo vet --locked

  # ── Dependency vulnerabilities (RustSec) ──
  audit:
    runs-on: ubuntu-latest
    container:
      image: rust:1-alpine
    steps:
      - run: apk add --no-cache git nodejs
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # ── SAST (Semgrep, Rust ruleset) ──
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      # semgrep image ships git; no JS actions needed here.
      - run: |
          git clone --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" repo
          cd repo
          git fetch --depth 1 origin "$GITHUB_SHA" && git checkout "$GITHUB_SHA"
      - working-directory: repo
        run: semgrep scan --config p/rust --error --quiet

  # ── Release gate: build packages only for a new/tagged version ──
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve workspace version
        id: version
        shell: bash
        env:
          FORCE_PACKAGE: ${{ inputs.force_package }}
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "v$version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE_PACKAGE" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # ── PR path filter: package smoke only when build inputs change ──
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      package: ${{ steps.filter.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            package:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'packaging/**'
              - 'install.sh'
              - 'scripts/**'

  # ── Nix flake: package the pinned musl artifact (fast, reproducible) ──
  flake:
    runs-on: ubuntu-latest
    container:
      image: nixos/nix
    steps:
      # No JS actions in this image (runner node cannot exec here).
      - run: |
          git init repo && cd repo
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD
          git config --global --add safe.directory "$GITHUB_WORKSPACE/repo"
      - working-directory: repo
        run: nix flake check
      - working-directory: repo
        run: nix build --out-link artifacts/result

  # ── Package: musl release binaries (Alpine), publish tag or rolling latest ──
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: rust:1-alpine
    needs: [test, lint, vet, audit, sast, flake, version, changes]
    if: needs.version.outputs.release == 'true' || (github.event_name == 'pull_request' && needs.changes.outputs.package == 'true')
    steps:
      - run: |
          apk add --no-cache git nodejs linux-pam-dev tar \
            cmake fontconfig-dev freetype-dev libxkbcommon-dev expat-dev pkgconf
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Release builds are the expensive part: reuse deps + unchanged crate
      # artifacts, and skip this job entirely when the version is already tagged.
      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            /root/.cargo/registry
            /root/.cargo/git
            artifacts/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-
      # gh invokes git; container ownership differs from the checkout dir owner.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build release binaries
        run: |
          cargo build --release -p ursined --features pam
          cargo build --release -p ursine
          mkdir -p artifacts/pkg/bin
          cp artifacts/target/release/ursined artifacts/target/release/ursine artifacts/pkg/bin/
          cp install.sh artifacts/pkg/
          cp -r packaging artifacts/pkg/
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="ursine-${GITHUB_REF_NAME}-x86_64-musl.tar.gz"
          else
            NAME="ursine-latest-x86_64-musl.tar.gz"
          fi
          tar czf "$NAME" -C artifacts/pkg .
          sha256sum "$NAME" > "$NAME.sha256"
          echo "ASSET=$NAME" >> "$GITHUB_ENV"
          echo "CHECKSUM=$NAME.sha256" >> "$GITHUB_ENV"
          tar tzf "$NAME"
          cat "$NAME.sha256"
      - name: Smoke-test release installer
        run: |
          sh -n install.sh
          sh -n packaging/openrc/ursined
          sh -n packaging/dinit/ursined.wrapper
          mkdir -p artifacts/smoke
          tar xzf "$ASSET" -C artifacts/smoke
          for init in systemd openrc dinit; do
            root="$PWD/artifacts/smoke/root-$init"
            case "$init" in
            systemd)
              artifacts/smoke/install.sh --destdir "$root" --prefix /usr --init systemd --no-start
              test -f "$root/etc/systemd/system/ursined.service"
              ;;
            openrc)
              artifacts/smoke/install.sh --destdir "$root" --prefix /usr --init openrc --no-start
              test -x "$root/etc/init.d/ursined"
              ;;
            dinit)
              artifacts/smoke/install.sh --destdir "$root" --prefix /usr --init dinit \
                --unitdir /lib/dinit.d --libexecdir /usr/lib --no-start
              test -f "$root/lib/dinit.d/ursined"
              test -x "$root/usr/lib/dinit/ursined"
              test -f "$root/etc/dinit.d/config/ursined.conf"
              ;;
            esac
            test -f "$root/etc/pam.d/ursine"
            test "$(stat -c '%a' "$root/etc/pam.d/ursine")" = "644"
            test -x "$root/usr/bin/ursine"
            test -x "$root/usr/sbin/ursined"
            test "$("$root/usr/sbin/ursined" --version | grep -c 'auth: pam')" = "1"
          done
      - name: Stage release assets
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          mkdir -p artifacts/release
          cp "$ASSET" "$CHECKSUM" artifacts/release/
      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: ursine-release
          path: artifacts/release
          if-no-files-found: error
          retention-days: 7

  # ── Publish: write token isolated from build code ──────────────────────────
  publish:
    runs-on: ubuntu-latest
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
      actions: read
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      # Checkout main explicitly: a tag build updates the release pin on main.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ursine-release
          path: artifacts/release
      - name: Resolve asset names
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="ursine-${GITHUB_REF_NAME}-x86_64-musl.tar.gz"
          else
            NAME="ursine-latest-x86_64-musl.tar.gz"
          fi
          echo "ASSET=$NAME" >> "$GITHUB_ENV"
          echo "CHECKSUM=$NAME.sha256" >> "$GITHUB_ENV"
          echo "FLAKE_ASSET=ursine-flake-${GITHUB_REF_NAME}.tar.gz" >> "$GITHUB_ENV"
      - name: Publish versioned tag release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: artifacts/release
        run: |
          sha256sum -c "$CHECKSUM"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for artifact in "$ASSET" "$CHECKSUM"; do
            if printf '%s\n' "$assets" | grep -Fxq "$artifact"; then
              echo "already published: $artifact"
            else
              gh release upload "$GITHUB_REF_NAME" "$artifact"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin release in nix/binary.nix
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          rm -f "artifacts/release/$CHECKSUM"
          gh release download "$GITHUB_REF_NAME" --pattern "$CHECKSUM" --dir artifacts/release
          sha=$(cut -d' ' -f1 "artifacts/release/$CHECKSUM")
          test -n "$sha"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ASSET}"
          sed -i \
            -e "s|^  version = \".*\";|  version = \"${version}\";|" \
            -e "s|^  url = \".*\";|  url = \"${url}\";|" \
            -e "s|^  sha256 = \".*\";|  sha256 = \"${sha}\";|" \
            nix/binary.nix
          if git diff --quiet -- nix/binary.nix; then
            echo "release pin already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/binary.nix
          git commit -m "chore(nix): pin release ${GITHUB_REF_NAME} [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
      - name: Package flake source
        run: |
          tar czf "artifacts/release/$FLAKE_ASSET" flake.nix flake.lock nix README.md
          sha256sum "artifacts/release/$FLAKE_ASSET" > "artifacts/release/$FLAKE_ASSET.sha256"
      - name: Attach flake to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: artifacts/release
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for artifact in "$FLAKE_ASSET" "$FLAKE_ASSET.sha256"; do
            if printf '%s\n' "$assets" | grep -Fxq "$artifact"; then
              echo "already published: $artifact"
            else
              gh release upload "$GITHUB_REF_NAME" "$artifact"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish rolling `latest` (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: artifacts/release
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "$ASSET" "$CHECKSUM" "$FLAKE_ASSET" "$FLAKE_ASSET.sha256" \
            --title "Development snapshot (latest)" \
            --notes "Automated musl build from $GITHUB_SHA on $(date -u +%Y-%m-%dT%H:%MZ)" \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Verify the auto-updated Nix pin on main after a tag release ──
  verify-pin:
    runs-on: ubuntu-latest
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    container:
      image: nixos/nix
    steps:
      - run: |
          git init repo && cd repo
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin main
          git checkout FETCH_HEAD
          nix flake check
