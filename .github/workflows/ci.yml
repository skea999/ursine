# Ursine CI — fully containerized (rule 9): no host toolchains on runners.
#
# Jobs: test matrix (default/pam) · lint (clippy+fmt) · vet (cargo-vet) ·
#       audit (RustSec advisories) · sast (Semgrep) · flake (check+build) ·
#       publish (rolling `latest` release: flake archive + binaries) ·
#       release (version tags).
#
# Notes:
# - cargo jobs use rust:1-alpine = same musl base as ci/Containerfile.dev.
# - nix jobs use nixos/nix and avoid JS actions: runner node cannot exec in
#   that image, so we git-clone manually and use the nix-provided `gh`.
# - alpine-based image = FeralOS target (musl dynamic, never glibc).
# Layout/spec reference: docs/specs/SPEC-packaging-infra.md

name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # rolling `latest` + tag releases

env:
  CARGO_TERM_COLOR: never
  NIX_CONFIG: "experimental-features = nix-command flakes"

jobs:
  # ── Test matrix: one cargo test run per feature combination, musl ──
  test:
    runs-on: ubuntu-latest
    container:
      image: rust:1-alpine
    strategy:
      fail-fast: false
      matrix:
        features: ["", "pam"]
    name: test (${{ matrix.features || 'default' }})
    steps:
      - run: apk add --no-cache git nodejs linux-pam-dev
      - uses: actions/checkout@v4
      - name: Test
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo test --workspace --no-default-features
          else
            cargo test --workspace --features ${{ matrix.features }}
          fi

  # ── Lint + format gate (all features) ──
  lint:
    runs-on: ubuntu-latest
    container:
      image: rust:1-alpine
    steps:
      - run: apk add --no-cache git nodejs linux-pam-dev
      - run: rustup component add clippy rustfmt
      - uses: actions/checkout@v4
      - run: cargo clippy --workspace --all-features -- -D warnings
      - run: cargo fmt --check

  # ── Supply-chain vetting (cargo-vet) ──
  vet:
    runs-on: ubuntu-latest
    container:
      image: rust:1-alpine
    steps:
      - run: apk add --no-cache git nodejs
      - uses: actions/checkout@v4
      # musl container: taiki-e prebuilds are glibc; build from source instead.
      - run: cargo install cargo-vet --locked
      - run: cargo vet --locked

  # ── Dependency vulnerabilities (RustSec) ──
  audit:
    runs-on: ubuntu-latest
    container:
      image: rust:1-alpine
    steps:
      - run: apk add --no-cache git nodejs
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # ── SAST (Semgrep, Rust ruleset) ──
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      # semgrep image ships git; no JS actions needed here.
      - run: |
          git clone --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" repo
          cd repo
          git fetch --depth 1 origin "$GITHUB_SHA" && git checkout "$GITHUB_SHA"
      - working-directory: repo
        run: semgrep scan --config p/rust --error --quiet

  # ── Nix flake: check + build (pkgsMusl, dynamic musl, never glibc) ──
  flake:
    runs-on: ubuntu-latest
    container:
      image: nixos/nix
    steps:
      - name: Clone (no JS actions in this image)
        run: |
          git init repo && cd repo
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD
          git config --global --add safe.directory "$GITHUB_WORKSPACE/repo"
      - working-directory: repo
        run: nix flake check
      - working-directory: repo
        run: nix build --out-link artifacts/result

  # ── Publish: rolling `latest` release (flake archive + dev binaries) ──
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: nixos/nix
    needs: [flake]
    steps:
      - run: nix profile install nixpkgs#gh
      - name: Clone (no JS actions in this image)
        run: |
          git init repo && cd repo
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD
          git config --global --add safe.directory "$GITHUB_WORKSPACE/repo"
      - name: Build + package
        working-directory: repo
        run: |
          nix build --out-link artifacts/result
          mkdir -p artifacts/pkg
          cp artifacts/result/bin/ursined artifacts/result/bin/ursine artifacts/pkg/
          tar czf artifacts/ursine-dev-x86_64-musl.tar.gz -C artifacts/pkg .
          nix flake archive --to "file:$PWD/artifacts/ursine-flake.tar"
          tar tzf artifacts/ursine-dev-x86_64-musl.tar.gz
      - name: Publish rolling `latest` release
        working-directory: repo
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            artifacts/ursine-dev-x86_64-musl.tar.gz \
            artifacts/ursine-flake.tar \
            --title "Development snapshot (latest)" \
            --notes "Automated musl build from $GITHUB_SHA on $(date -u +%Y-%m-%dT%H:%MZ)" \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Release: musl binaries + flake archive on version tags ──
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: nixos/nix
    needs: [test, lint, vet, audit, sast, flake]
    steps:
      - run: nix profile install nixpkgs#gh
      - name: Clone (no JS actions in this image)
        run: |
          git init repo && cd repo
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD
          git config --global --add safe.directory "$GITHUB_WORKSPACE/repo"
      - name: Build + package
        working-directory: repo
        run: |
          nix build --out-link artifacts/result
          mkdir -p artifacts/pkg
          cp artifacts/result/bin/ursined artifacts/result/bin/ursine artifacts/pkg/
          tar czf "ursine-${GITHUB_REF_NAME}-x86_64-musl.tar.gz" -C artifacts pkg
          nix flake archive --to "file:$PWD/artifacts/ursine-flake.tar"
          tar tzf "ursine-${GITHUB_REF_NAME}-x86_64-musl.tar.gz"
      - run: |
          gh release create "$GITHUB_REF_NAME" \
            "repo/ursine-${GITHUB_REF_NAME}-x86_64-musl.tar.gz" \
            repo/artifacts/ursine-flake.tar \
            --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
