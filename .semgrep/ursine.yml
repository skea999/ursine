rules:
  - id: ursine-no-unsafe
    languages: [rust]
    severity: ERROR
    message: unsafe blocks are forbidden in Ursine crates
    pattern: unsafe { ... }

  - id: ursine-no-command-outside-exec
    languages: [rust]
    severity: ERROR
    message: std::process::Command must only be used in packages_nix/exec.rs
    paths:
      exclude:
        - src/ursine-core/src/modules/packages_nix/exec.rs
        - "**/tests/**"
    pattern: std::process::Command::new(...)

  - id: ursine-no-temp-dir
    languages: [rust]
    severity: ERROR
    message: temp files must go under artifacts/, never std::env::temp_dir()
    paths:
      exclude:
        - "**/tests/**"
    patterns:
      - pattern: std::env::temp_dir()
      - pattern-not-inside: |
          #[cfg(test)]
          mod tests { ... }
      - pattern-not-inside: |
          mod tests { ... }
